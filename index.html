<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Event Planner | Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-serif-italic { font-family: 'Playfair Display', serif; font-style: italic; }
        
        /* Smooth section transitions */
        .fade-step {
            transition: all 0.5s ease-in-out;
        }
        .hidden-step {
            display: none;
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- MAIN PORTAL CARD -->
    <div id="portalCard" class="w-full max-w-[400px] bg-white rounded-[2.5rem] overflow-hidden shadow-2xl animate-fadeIn">
        
        <!-- Top Green Section -->
        <div class="bg-[#059669] p-10 text-center text-white relative">
            <!-- Building Icon -->
            <div class="bg-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
                <svg class="w-8 h-8 text-[#059669]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9L12 3l9 6v12H3V9z" />
                </svg>
            </div>
            
            <h1 class="text-3xl font-serif-italic mb-2">Maryam Event Planner</h1>
            <p class="text-[10px] tracking-[0.3em] uppercase opacity-80 font-bold">Administrator Portal</p>
        </div>

        <!-- Bottom White Section -->
        <div class="p-10 pt-12 pb-14 text-center">
            
            <!-- STEP 1: PASSWORD SECTION -->
            <div id="passwordStep" class="fade-step">
                <h2 class="text-xl font-bold text-slate-800 mb-2">Security Check</h2>
                <p class="text-slate-400 text-sm mb-8">Please enter your administrator password.</p>
                
                <div class="space-y-4">
                    <input id="passwordInput" type="password" placeholder="Enter password" 
                           oninput="validateRealTime()"
                           class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-center">
                    
                    <button id="enterBtn" onclick="transitionToGoogle()"
                            class="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl opacity-20 pointer-events-none transition-all active:scale-95">
                        Verify Access
                    </button>
                </div>
            </div>

            <!-- STEP 2: GOOGLE SIGN-IN SECTION (Hidden initially) -->
            <div id="googleStep" class="fade-step hidden-step">
                <h2 class="text-xl font-bold text-[#0f172a] mb-2">Welcome Back</h2>
                <p class="text-slate-500 text-sm mb-10 leading-relaxed">Sign in with your Google account to <br> manage your events.</p>
                
                <button class="w-full py-4 border border-slate-200 rounded-2xl flex items-center justify-center gap-3 font-semibold text-slate-700 hover:bg-slate-50 transition-all active:scale-95 shadow-sm">
                    <img src="https://www.gstatic.com" class="w-5 h-5" alt="Google">
                    Sign in with Google
                </button>

                <p class="mt-12 text-[10px] tracking-widest uppercase text-slate-300 font-bold">Secure Cloud Access</p>
            </div>

        </div>
    </div>

    <script>
        // Set your access password here
        const ACCESS_CODE = "1234";

        function validateRealTime() {
            const input = document.getElementById('passwordInput');
            const btn = document.getElementById('enterBtn');

            if (input.value === ACCESS_CODE) {
                btn.classList.remove('opacity-20', 'pointer-events-none');
                btn.classList.add('bg-emerald-500', 'shadow-lg', 'shadow-emerald-200');
                
                // Automatically transition after 400ms delay
                setTimeout(transitionToGoogle, 400);
            } else {
                btn.classList.add('opacity-20', 'pointer-events-none');
                btn.classList.remove('bg-emerald-500', 'shadow-lg');
            }
        }

        function transitionToGoogle() {
            const pStep = document.getElementById('passwordStep');
            const gStep = document.getElementById('googleStep');

            // 1. Fade out password
            pStep.style.opacity = "0";
            pStep.style.transform = "translateY(-10px)";
            
            setTimeout(() => {
                pStep.style.display = "none";
                
                // 2. Prepare Google step
                gStep.classList.remove('hidden-step');
                gStep.style.display = "block";
                
                // 3. Fade in Google step
                setTimeout(() => {
                    gStep.style.opacity = "1";
                    gStep.style.transform = "translateY(0)";
                }, 50);
            }, 500);
        }

        // Support "Enter" key
        document.getElementById("passwordInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter" && document.getElementById("passwordInput").value === ACCESS_CODE) {
                transitionToGoogle();
            }
        });
    </script>
</body>
</html>
