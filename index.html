<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Event Planner | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary: #059669;
            --glass: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.15);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617; 
            overflow: hidden; 
            perspective: 1500px;
        }

        /* 3D Scene Setup */
        .scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        /* Floating 3D Card */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 50px;
            width: 400px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
        }

        /* 3D Floating Elements */
        .float-layer {
            transform: translateZ(50px); /* Pushes text forward in 3D space */
        }

        /* The "Alive" 3D Eye */
        .eye-socket {
            width: 34px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pupil {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #fff, #34d399);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
            transition: transform 0.1s ease-out;
        }

        .eyelid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #1e293b;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }
        .eyelid-top { top: -100%; transform: translateY(0); }
        .eyelid-bottom { bottom: -100%; transform: translateY(0); }

        /* Eye closed state */
        .is-closed .eyelid-top { transform: translateY(100%); }
        .is-closed .eyelid-bottom { transform: translateY(-100%); }

        /* Futuristic Input */
        .input-box {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .input-box:focus-within {
            border-color: #34d399;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 20px rgba(5, 150, 105, 0.2);
        }

        /* Reveal Button Animation */
        #enterBtn {
            opacity: 0;
            transform: translateZ(80px) scale(0.8) translateY(20px);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(135deg, #10b981, #059669);
        }
        #enterBtn.active {
            opacity: 1;
            transform: translateZ(80px) scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Background Particle Effect (Simplified) */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(5, 150, 105, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loginScreen" class="scene transition-opacity duration-1000">
        <!-- Ambient Background Lights -->
        <div class="bg-glow" style="top: -10%; left: -10%;"></div>
        <div class="bg-glow" style="bottom: -10%; right: -10%;"></div>

        <!-- The 3D Card -->
        <div class="glass-card" id="card">
            <div class="float-layer text-center">
                <h1 class="text-white text-xs tracking-[0.4em] uppercase opacity-50 mb-2">Authenticated Access</h1>
                <h2 class="font-serif text-white text-4xl mb-12 italic">Maryam Event Planner</h2>
                
                <div class="space-y-8">
                    <!-- Password Field -->
                    <div class="input-box flex items-center px-6 py-4 rounded-2xl">
                        <input id="passwordInput" type="password" placeholder="Enter Security Key" 
                               oninput="handleInput()"
                               class="bg-transparent border-none outline-none w-full text-white text-lg placeholder-white/20 tracking-[0.2em]">
                        
                        <!-- 3D Eye Widget -->
                        <div onclick="toggleSecurityView()" class="eye-socket" id="eye">
                            <div class="eyelid eyelid-top"></div>
                            <div class="pupil" id="pupil"></div>
                            <div class="eyelid eyelid-bottom"></div>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="flex items-center gap-3 text-white/40 text-sm pl-2">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-none bg-white/10 accent-emerald-500">
                        <label for="remember" class="cursor-pointer hover:text-white/60 transition-colors">Trust this workspace</label>
                    </div>

                    <!-- Hidden 3D Button -->
                    <button id="enterBtn" onclick="grantAccess()" 
                            class="w-full py-4 text-white font-bold rounded-2xl text-lg shadow-[0_20px_40px_rgba(5,150,105,0.4)] hover:brightness-110 active:scale-95">
                        Initialize Dashboard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Root -->
    <div id="root"></div>

    <script>
        const PASS = "mep5655";
        const card = document.getElementById('card');
        const pupil = document.getElementById('pupil');

        // 1. 3D Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;

            // Eye Tracking
            const pupilX = (e.pageX / window.innerWidth - 0.5) * 10;
            const pupilY = (e.pageY / window.innerHeight - 0.5) * 10;
            pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
        });

        // 2. Security Check (Real-time)
        function handleInput() {
            const input = document.getElementById('passwordInput');
            const btn = document.getElementById('enterBtn');
            if (input.value === PASS) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        // 3. Alive Eye Toggle
        function toggleSecurityView() {
            const input = document.getElementById('passwordInput');
            const eye = document.getElementById('eye');
            
            if (input.type === "password") {
                input.type = "text";
                eye.classList.add('is-closed');
            } else {
                input.type = "password";
                eye.classList.remove('is-closed');
            }
        }

        // 4. Grant Access
        function grantAccess() {
            if (document.getElementById('remember').checked) {
                localStorage.setItem('mep_session', 'active');
            }
            const screen = document.getElementById('loginScreen');
            screen.style.opacity = '0';
            screen.style.transform = 'translateZ(500px)'; // Zoom out effect
            setTimeout(() => screen.style.display = 'none', 1000);
        }

        // Auto-login check
        if (localStorage.getItem('mep_session') === 'active') {
            document.getElementById('loginScreen').style.display = 'none';
        }

        // Enter Key Support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('passwordInput').value === PASS) {
                grantAccess();
            }
        });
    </script>
</body>
</html>
