<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Event Planner</title>
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./assets/manifest-DuaE7qh9.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://cdn.sheetjs.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Animated Eye Button */
        .eye-wrapper {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .eye-wrapper:hover { transform: scale(1.1); }
        
        /* Hidden by default button style */
        #enterBtn {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #enterBtn.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.8s ease-out; }
    </style>

    <link rel="stylesheet" href="/index.css">
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh@^19.2.3/",
        "react": "https://esm.sh@^19.2.3",
        "react-dom/": "https://esm.sh-dom@^19.2.3/"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-Bg5jYz3a.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- LOGIN SCREEN START -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center transition-opacity duration-1000">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 bg-cover bg-center z-[-1]" 
             style="background-image: url('https://images.unsplash.com');">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <!-- Glass Login Box -->
        <div class="glass-container relative w-[340px] p-10 rounded-[2rem] shadow-2xl text-white text-center animate-fadeIn">
            <h2 class="text-3xl font-serif mb-10 tracking-widest uppercase">Welcome</h2>
            
            <div class="space-y-6">
                <!-- Password Field -->
                <div class="relative flex items-center border-b border-white/30 pb-2 transition-all focus-within:border-white">
                    <input id="passwordInput" type="password" placeholder="Enter password" 
                           oninput="validateRealTime()"
                           class="bg-transparent border-none outline-none w-full text-lg placeholder-white/50 focus:ring-0">
                    
                    <!-- Realistic Eye Button -->
                    <div onclick="togglePassword()" class="eye-wrapper" id="eyeBtn">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 opacity-70">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle id="pupil" cx="12" cy="12" r="3" fill="currentColor"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Remember Me -->
                <div id="rememberSection" class="flex items-center gap-2 text-sm opacity-60 justify-start transition-opacity">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 accent-emerald-500 rounded border-none bg-white/20">
                    <label for="rememberMe" class="cursor-pointer">Remember me</label>
                </div>

                <!-- Hidden Login Button (Appears on correct pass) -->
                <button id="enterBtn" onclick="unlockTransition()" 
                        class="w-full py-4 bg-white text-slate-900 font-bold rounded-full text-lg shadow-xl hover:bg-emerald-50 transition-all active:scale-95">
                    Unlock App
                </button>
            </div>
        </div>
    </div>
    <!-- LOGIN SCREEN END -->

    <div id="root"></div>

    <script>
    // --- SET YOUR PASSWORD HERE ---
    const CORRECT_PASS = "1234"; 

    // Auto-login if remembered
    window.onload = () => {
        if (localStorage.getItem("mep_authorized") === "true") {
            document.getElementById("loginScreen").style.display = "none";
        }
    };

    // Real-time password check to trigger automatic login
    function validateRealTime() {
        const val = document.getElementById("passwordInput").value;
        const btn = document.getElementById("enterBtn");
        const remember = document.getElementById("rememberSection");

        if (val === CORRECT_PASS) {
            btn.classList.add("show");
            remember.style.opacity = "1";
            
            // AUTOMATIC TRANSITION:
            // Waits 300ms so the user sees the last character typed before it fades.
            setTimeout(() => {
                unlockTransition();
            }, 300);

        } else {
            btn.classList.remove("show");
            remember.style.opacity = "0.6";
        }
    }

    // This handles the transition and hiding the login screen
    function unlockTransition(){
        const screen = document.getElementById("loginScreen");
        const remember = document.getElementById("rememberMe").checked;

        if (remember) {
            localStorage.setItem("mep_authorized", "true");
        }
        
        // Start Fade Out Animation
        screen.style.opacity = "0";
        setTimeout(() => {
            screen.style.display = "none";
            // Once this is gone, the Google Sign-In (React Root) will be visible
        }, 1000);
    }

    function togglePassword(){
        const input = document.getElementById("passwordInput");
        const pupil = document.getElementById("pupil");
        const eyeIcon = document.getElementById("eyeIcon");

        if (input.type === "password") {
            input.type = "text";
            pupil.setAttribute("fill", "none"); 
            eyeIcon.style.opacity = "1";
        } else {
            input.type = "password";
            pupil.setAttribute("fill", "currentColor");
            eyeIcon.style.opacity = "0.7";
        }
    }

    // Allow "Enter" key fallback
    document.getElementById("passwordInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter" && document.getElementById("passwordInput").value === CORRECT_PASS) {
            unlockTransition();
        }
    });

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.worker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
