<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Event Planner</title>
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./assets/manifest-DuaE7qh9.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://cdn.sheetjs.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            outline: none;
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.7); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
    </style>

    <link rel="stylesheet" href="/index.css">
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh@^19.2.3/",
        "react": "https://esm.sh@^19.2.3",
        "react-dom/": "https://esm.sh-dom@^19.2.3/"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-Bg5jYz3a.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- LOGIN SCREEN START -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center transition-opacity duration-500">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 bg-cover bg-center z-[-1]" 
             style="background-image: url('https://images.unsplash.com');">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <!-- Glass Login Box -->
        <div class="glass-container relative w-[340px] p-10 rounded-2xl shadow-2xl text-white text-center animate-fadeIn">
            <h2 class="text-3xl font-serif mb-10">Welcome</h2>
            
            <div class="space-y-8">
                <!-- Password Field Only -->
                <div class="relative flex items-center border-b border-white/40 pb-2">
                    <input id="passwordInput" type="password" placeholder="Enter password" 
                           class="bg-transparent border-none outline-none w-full text-lg placeholder-white/60">
                    <span onclick="togglePassword()" class="cursor-pointer opacity-70 ml-2">👁️</span>
                </div>

                <!-- Enter Button -->
                <button onclick="checkPassword()" 
                        class="w-full py-3 bg-white text-slate-900 font-bold rounded-full text-lg shadow-lg hover:bg-slate-100 transition-all active:scale-95">
                    Enter App
                </button>

                <!-- Error Message -->
                <p id="error" class="text-red-300 text-sm hidden animate-pulse">Wrong password. Try again.</p>
            </div>
        </div>
    </div>
    <!-- LOGIN SCREEN END -->

    <div id="root"></div>

    <script>
    function togglePassword(){
        const input = document.getElementById("passwordInput");
        input.type = input.type === "password" ? "text" : "password";
    }

    function checkPassword(){
        const password = "mep5655";
        const entered = document.getElementById("passwordInput").value;
        const errorMsg = document.getElementById("error");
        const screen = document.getElementById("loginScreen");

        if(entered === password){
            screen.style.opacity = "0";
            setTimeout(() => {
                screen.style.display = "none";
            }, 500);
        } else {
            errorMsg.classList.remove("hidden");
            // Simple visual shake for error
            const box = document.querySelector('.glass-container');
            box.style.transform = "translateX(5px)";
            setTimeout(() => box.style.transform = "translateX(-5px)", 100);
            setTimeout(() => box.style.transform = "translateX(0)", 200);
        }
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
