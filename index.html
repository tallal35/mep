<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryam Event Planner</title>
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./assets/manifest-DuaE7qh9.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://cdn.sheetjs.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        
        /* Eye icon hover effect */
        .eye-icon:hover { opacity: 1; transform: scale(1.1); }
        .eye-icon { transition: all 0.2s ease; }
    </style>

    <link rel="stylesheet" href="/index.css">
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh@^19.2.3/",
        "react": "https://esm.sh@^19.2.3",
        "react-dom/": "https://esm.sh-dom@^19.2.3/"
      }
    }
    </script>
    <script type="module" crossorigin src="./assets/index-Bg5jYz3a.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- LOGIN SCREEN START -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center transition-opacity duration-700">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 bg-cover bg-center z-[-1]" 
             style="background-image: url('https://images.unsplash.com');">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>

        <!-- Glass Login Box -->
        <div class="glass-container relative w-[340px] p-10 rounded-3xl shadow-2xl text-white text-center animate-fadeIn">
            <h2 class="text-3xl font-serif mb-10 tracking-wide">Welcome</h2>
            
            <div class="space-y-6">
                <!-- Password Field -->
                <div class="relative flex items-center border-b border-white/40 pb-2">
                    <input id="passwordInput" type="password" placeholder="Enter password" 
                           class="bg-transparent border-none outline-none w-full text-lg placeholder-white/60 focus:ring-0">
                    
                    <!-- "Alive" Eye Icon SVG -->
                    <button onclick="togglePassword()" class="eye-icon opacity-70 focus:outline-none" id="eyeBtn">
                        <svg id="eyeOpen" xmlns="http://www.w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg id="eyeClosed" class="hidden" xmlns="http://www.w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>

                <!-- Remember Function -->
                <div class="flex items-center gap-2 text-sm opacity-80 justify-start">
                    <input type="checkbox" id="rememberMe" class="w-4 h-4 accent-emerald-500 rounded border-none">
                    <label for="rememberMe" class="cursor-pointer">Keep me logged in</label>
                </div>

                <!-- Enter Button -->
                <button onclick="checkPassword()" 
                        class="w-full py-3 bg-white text-slate-900 font-bold rounded-full text-lg shadow-lg hover:bg-slate-100 transition-all active:scale-95">
                    Enter App
                </button>

                <!-- Error Message -->
                <p id="error" class="text-red-300 text-sm hidden animate-pulse">Incorrect password</p>
            </div>
        </div>
    </div>
    <!-- LOGIN SCREEN END -->

    <div id="root"></div>

    <script>
    // Check if user is already remembered
    window.onload = () => {
        if (localStorage.getItem("isLoggedIn") === "true") {
            document.getElementById("loginScreen").style.display = "none";
        }
    };

    function togglePassword(){
        const input = document.getElementById("passwordInput");
        const eyeOpen = document.getElementById("eyeOpen");
        const eyeClosed = document.getElementById("eyeClosed");

        if (input.type === "password") {
            input.type = "text";
            eyeOpen.classList.add("hidden");
            eyeClosed.classList.remove("hidden");
        } else {
            input.type = "password";
            eyeOpen.classList.remove("hidden");
            eyeClosed.classList.add("hidden");
        }
    }

    // Allow "Enter" key to submit
    document.getElementById("passwordInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkPassword();
    });

    function checkPassword(){
        const password = "mep12";
        const entered = document.getElementById("passwordInput").value;
        const errorMsg = document.getElementById("error");
        const screen = document.getElementById("loginScreen");
        const remember = document.getElementById("rememberMe").checked;

        if(entered === password){
            // Remember function
            if (remember) {
                localStorage.setItem("isLoggedIn", "true");
            }
            
            screen.style.opacity = "0";
            setTimeout(() => {
                screen.style.display = "none";
            }, 600);
        } else {
            errorMsg.classList.remove("hidden");
            // Shake effect
            const box = document.querySelector('.glass-container');
            box.style.transform = "translateX(8px)";
            setTimeout(() => box.style.transform = "translateX(-8px)", 80);
            setTimeout(() => box.style.transform = "translateX(0)", 160);
        }
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
