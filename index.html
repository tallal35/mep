<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEP | Neural Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --accent: #3b82f6;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617; 
            margin: 0;
            overflow: hidden; 
            perspective: 2000px;
            height: 100vh;
        }

        /* --- FUTURISTIC PLASMA BACKGROUND --- */
        .plasma-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a, #020617);
            filter: contrast(120%);
        }

        .orb {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            transition: all 2s ease-in-out; /* Smooth color transitions */
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.2); }
        }

        /* --- 3D INTERACTIVE CARD --- */
        .scene {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1); /* Zoom effect */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 60px;
            width: 420px;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.05);
            transform-style: preserve-3d;
            position: relative;
        }

        /* Animated Eye 3D */
        .eye-socket {
            width: 36px;
            height: 22px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--primary);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .pupil {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary);
            transition: transform 0.1s ease-out;
        }

        .lid {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #0f172a;
            transition: transform 0.4s ease;
            z-index: 2;
        }
        .lid-top { top: -100%; }
        .lid-bottom { bottom: -100%; }
        .is-closed .lid-top { transform: translateY(100%); }
        .is-closed .lid-bottom { transform: translateY(-100%); }

        /* Button logic */
        #enterBtn {
            opacity: 0;
            transform: translateZ(100px) scale(0.5);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        #enterBtn.ready {
            opacity: 1;
            transform: translateZ(100px) scale(1);
            pointer-events: auto;
        }

        /* Space-Zoom Transition */
        .hyperspace {
            transform: translateZ(2000px) rotateX(20deg) !important;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Plasma Background -->
    <div class="plasma-bg">
        <div id="orb1" class="orb" style="background: var(--primary); top: -10%; left: -10%;"></div>
        <div id="orb2" class="orb" style="background: var(--accent); bottom: -10%; right: -10%;"></div>
    </div>

    <div id="loginScreen" class="scene">
        <div class="glass-card" id="card">
            <div style="transform: translateZ(60px)" class="text-center">
                <h1 class="text-white/30 text-[10px] tracking-[0.6em] uppercase mb-4">Neural Handshake Required</h1>
                <h2 class="font-serif text-white text-4xl mb-12 italic tracking-tighter">Maryam Event Planner</h2>
                
                <div class="space-y-8">
                    <!-- Password Field -->
                    <div class="bg-black/40 border border-white/10 rounded-2xl flex items-center px-6 py-5 focus-within:border-emerald-500/50 transition-all">
                        <input id="passwordInput" type="password" placeholder="SECURITY KEY" 
                               oninput="checkVal()"
                               class="bg-transparent border-none outline-none w-full text-white text-lg placeholder-white/10 tracking-[0.3em]">
                        
                        <div onclick="toggleEye()" class="eye-socket" id="eyeWidget">
                            <div class="lid lid-top"></div>
                            <div class="pupil" id="pupil"></div>
                            <div class="lid lid-bottom"></div>
                        </div>
                    </div>

                    <button id="enterBtn" onclick="initiateLaunch()" 
                            class="w-full py-5 text-white font-bold rounded-2xl text-lg shadow-[0_20px_50px_rgba(16,185,129,0.3)] hover:brightness-125">
                        INITIALIZE ACCESS
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        const KEY = "mep5655";
        const orb1 = document.getElementById('orb1');
        const orb2 = document.getElementById('orb2');
        const card = document.getElementById('card');
        const pupil = document.getElementById('pupil');

        // 1. Dynamic Background Colors (Changes every 2 seconds for futuristic feel)
        const colors = ['#10b981', '#3b82f6', '#8b5cf6', '#f43f5e', '#06b6d4'];
        setInterval(() => {
            const c1 = colors[Math.floor(Math.random() * colors.length)];
            const c2 = colors[Math.floor(Math.random() * colors.length)];
            orb1.style.background = c1;
            orb2.style.background = c2;
            orb1.style.boxShadow = `0 0 100px ${c1}`;
            orb2.style.boxShadow = `0 0 100px ${c2}`;
        }, 2000);

        // 2. 3D Parallax Tilt
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;

            const px = (e.pageX / window.innerWidth - 0.5) * 12;
            const py = (e.pageY / window.innerHeight - 0.5) * 12;
            pupil.style.transform = `translate(${px}px, ${py}px)`;
        });

        // 3. Real-time Security Validation
        function checkVal() {
            const input = document.getElementById('passwordInput');
            const btn = document.getElementById('enterBtn');
            btn.classList.toggle('ready', input.value === KEY);
        }

        function toggleEye() {
            const input = document.getElementById('passwordInput');
            const eye = document.getElementById('eyeWidget');
            input.type = input.type === "password" ? "text" : "password";
            eye.classList.toggle('is-closed');
        }

        // 4. Smooth Hyperspace Exit
        function initiateLaunch() {
            const scene = document.getElementById('loginScreen');
            scene.classList.add('hyperspace');
            
            // Log access
            localStorage.setItem('mep_access', 'granted');

            setTimeout(() => {
                scene.style.display = 'none';
                // Here is where your main app (id="root") becomes visible
            }, 1200);
        }

        // Handle Enter Key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('passwordInput').value === KEY) {
                initiateLaunch();
            }
        });

        // Auto-login check
        if (localStorage.getItem('mep_access') === 'granted') {
            document.getElementById('loginScreen').style.display = 'none';
        }
    </script>
</body>
</html>
